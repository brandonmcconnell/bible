name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Type-check generator and validate docs.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:proxy
      - run: npx mint validate
